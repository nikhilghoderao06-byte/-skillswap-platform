<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A1F44">
<title>SkillSwap is offline</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; background: #0A1F44; color: #fff;
         font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .card { max-width: 360px; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { font-size: 26px; margin: 20px 0 8px; }
  p { color: #DCE6FF; line-height: 1.5; margin: 0 0 24px; font-size: 16px; }
  button { background: #F5B700; color: #0A1F44; border: 0; border-radius: 10px; padding: 12px 24px; font-size: 16px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="SkillSwap">
    <h1>You are offline</h1>
    <p>SkillSwap needs an internet connection to load your swaps and sessions. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
